<!-- Messages de succès / erreur -->
<div *ngIf="successMessage || errorMessage" class="alert-container mb-3">
    <div *ngIf="successMessage" class="alert alert-success alert-dismissible fade show" role="alert">
        {{ successMessage }}
        <button type="button" class="btn-close" (click)="successMessage = null" aria-label="Close"></button>
    </div>
    <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible fade show" role="alert">
        {{ errorMessage }}
        <button type="button" class="btn-close" (click)="errorMessage = null" aria-label="Close"></button>
    </div>
</div>

<!-- Liste des utilisateurs -->
<div class="col-xl-12">
    <app-card cardTitle="Liste des utilisateurs" [options]="false" blockClass="card-grid-style">
        <div class="card-grid">
            <ng-container *ngFor="let user of paginatedUsers">
                <div *ngIf="user.role !== 'ADMIN'" class="user-card">
                    <!-- En-tête utilisateur -->
                    <div class="user-card-header d-flex align-items-center gap-3">
                        <div class="user-avatar">
                            <img [src]="user.image || 'assets/images/default-avatar.png'" alt="Image utilisateur"
                                class="profile-image rounded-circle" style="width: 60px; height: 60px;">
                        </div>
                        <div>
                            <h5 class="mb-0">{{ user.nom }}</h5>
                            <span class="text-muted"><i class="fa fa-briefcase me-1"></i>{{ user.role }}</span>
                        </div>
                    </div>

                    <!-- Corps utilisateur -->
                    <div class="user-card-body mt-3">
                        <p><strong>Email :</strong> {{ user.email }}</p>
                        <p><strong>CIN :</strong> {{ user.cin }}</p>
                    </div>

                    <!-- Pied utilisateur -->
                    <div class="user-card-footer d-flex justify-content-between" *ngIf="user.status !== true">
                        <button class="btn btn-success btn-sm" (click)="accepterUtilisateur(user)">
                            <i class="fa fa-check"></i> Accepter
                        </button>

                        <button class="btn btn-danger btn-sm" (click)="rejeterUtilisateur(user.id)">
                            <i class="fa fa-times"></i> Rejeter
                        </button>


                    </div>
                </div>
            </ng-container>
        </div>
    </app-card>

    <!-- Pagination -->
    <nav aria-label="Pagination des utilisateurs" class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" [class.disabled]="page === 1">
                <a class="page-link" href="javascript:void(0)" (click)="changePage(page - 1)">Précédent</a>
            </li>
            <li class="page-item" *ngFor="let p of [].constructor(totalPages); let i = index"
                [class.active]="page === i + 1">
                <a class="page-link" href="javascript:void(0)" (click)="changePage(i + 1)">{{ i + 1 }}</a>
            </li>
            <li class="page-item" [class.disabled]="page >= totalPages">
                <a class="page-link" href="javascript:void(0)" (click)="changePage(page + 1)">Suivant</a>
            </li>
        </ul>
    </nav>
</div>
